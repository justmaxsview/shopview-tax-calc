# Builds the rate data from csv/ and publishes it, plus the latest extension download, to GitHub Pages.
# If any CSV is invalid the build step fails, nothing is deployed, and the last good data stays live.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - "csv/**"
      - "scripts/**"
      - "extension/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits, a running deploy is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate and build rate files
        run: node scripts/build.js
      - name: Add extension download and version
        run: |
          cp extension/version.json dist/version.json
          (cd extension && zip -qr ../dist/shopview-tax-calc.zip .)
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
